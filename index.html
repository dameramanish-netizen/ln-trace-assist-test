<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LN Trace Assist - Final Smart Edition</title>
</head>
<body>

<script>
/*!
 * LN Trace Assist — Full Edition
 * 1. Web Streams for 8GB+ files.
 * 2. NLP Routing via compromise.js.
 * 3. Smart Table Auditing.
 */
(function () {
  'use strict';

  var CONFIG = Object.assign({ title: 'LN Trace Assist' }, window.LTB_CONFIG || {});

  /* ============================== STYLES ============================== */
  var CSS = [
    '#ltb-root{position:fixed;inset:auto 20px 20px auto;z-index:999999;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}',
    '#ltb-launcher{width:56px;height:56px;border-radius:16px;border:1px solid #2A3B57;background:linear-gradient(160deg,#16213B,#0B1220);box-shadow:0 10px 30px rgba(0,0,0,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:2px;transition:transform .15s ease;}',
    '#ltb-panel{position:absolute;bottom:70px;right:0;width:420px;max-width:calc(100vw - 24px);height:650px;background:#0B1220;border:1px solid #2A3B57;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden;}',
    '#ltb-panel.ltb-hidden{display:none;}',
    '#ltb-titlebar{display:flex;align-items:center;gap:8px;padding:12px 14px;background:#121B2E;border-bottom:1px solid #22314C;}',
    '.ltb-title{color:#E2E8F0;font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:600;flex:1;}',
    '#ltb-messages{flex:1 1 auto;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;background:#0B1220;}',
    '.ltb-msg{display:flex;flex-direction:column;}',
    '.ltb-msg-bot{align-items:flex-start;}',
    '.ltb-msg-user{align-items:flex-end;}',
    '.ltb-bubble{max-width:90%;padding:10px 12px;border-radius:12px;}',
    '.ltb-msg-bot .ltb-bubble{background:#152036;border:1px solid #22314C;}',
    '.ltb-msg-user .ltb-bubble{background:#F2A93C;color:#0B1220;}',
    '.ltb-text{color:#E2E8F0;font-size:13.5px;line-height:1.5;}',
    '#ltb-input-area{padding:12px;background:#121B2E;border-top:1px solid #22314C;}',
    '#ltb-input{width:100%;background:#0B1220;border:1px solid #2A3B57;color:#E2E8F0;padding:10px;border-radius:8px;font-size:13px;}',
    '.ltb-pre{background:#0B1220;border:1px solid #22314C;border-radius:8px;padding:10px;font-family:"JetBrains Mono",monospace;font-size:12px;color:#34D399;white-space:pre;overflow:auto;margin-top:8px;}',
    '.ltb-upload-btn{background:#1B2740;border:1px dashed #3A4E75;color:#E2E8F0;padding:10px;width:100%;border-radius:8px;cursor:pointer;}'
  ].join('\n');

  var styleEl = document.createElement('style'); styleEl.textContent = CSS; document.head.appendChild(styleEl);

  /* ============================ SMART ENGINE =============================== */
  var nlpPromise = null;
  function ensureNLP() {
    if (window.nlp) return Promise.resolve(window.nlp);
    return nlpPromise || (nlpPromise = new Promise(res => {
      var s = document.createElement('script'); s.src = 'https://unpkg.com/compromise';
      s.onload = () => res(window.nlp); document.head.appendChild(s);
    }));
  }

  async function processStreamedFile(file, onLineRead, onStatusUpdate) {
    let stream = file.stream();
    if (file.name.toLowerCase().endsWith('.gz')) stream = stream.pipeThrough(new DecompressionStream('gzip'));
    const reader = stream.pipeThrough(new TextDecoderStream()).getReader();
    let remainder = '', lineCount = 0;
    try {
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const lines = (remainder + (value || '')).split(/\r?\n/);
        remainder = lines.pop();
        for (let line of lines) {
          lineCount++;
          if (onLineRead(line, lineCount)) return lineCount;
        }
        if (lineCount % 250000 === 0 && onStatusUpdate) onStatusUpdate(lineCount);
      }
      if (remainder) onLineRead(remainder, ++lineCount);
      return lineCount;
    } finally { reader.releaseLock(); }
  }

  /* =============================== FLOWS ================================== */
  async function startDebuggerFlow(preset) {
    preset = preset || {};
    var container = document.createElement('div');
    container.appendChild(createDropzone('.txt,.log,.gz', '📎 Upload Trace', async function (file) {
      var statusEl = document.createElement('div'); container.appendChild(statusEl);
      let matches = [], count = 0;
      await processStreamedFile(file, (line, ln) => {
        let show = false;
        if (preset.presetAudit) {
            if (line.includes(preset.presetKeywords[0])) count++;
        } else {
            if (preset.presetKeywords.some(k => line.includes(k))) show = true;
            if (show) matches.push(line);
        }
        return matches.length >= 1000;
      }, (lines) => statusEl.textContent = 'Scanning: ' + lines.toLocaleString());
      
      if (preset.presetAudit) botText('<b>Audit:</b> ' + preset.presetKeywords[0] + ' accessed <b>' + count + '</b> times.');
      else {
          botText('Found ' + matches.length + ' matches.');
          var pre = document.createElement('pre'); pre.className = 'ltb-pre'; pre.textContent = matches.join('\n');
          addMessage('bot', pre);
      }
    }));
    addMessage('bot', container);
  }

  /* ============================ SMART ROUTER ============================== */
  async function handleUserMessage(msg) {
    const nlp = await ensureNLP();
    let doc = nlp(msg.toLowerCase());
    let tableMatch = msg.match(/[a-z]{5}\d{3}/g);
    let funcMatch = msg.match(/[a-z]+\.dll\d+\.[a-z\.]+/g);
    let target = funcMatch ? funcMatch[0] : (tableMatch ? tableMatch[0] : null);

    if (doc.has('(audit|summary|count)')) {
        botText('Auditing ' + target + '. Upload file.');
        startDebuggerFlow({ presetKeywords: [target], presetAudit: true });
    } else if (doc.has('(error|bug|fail|stack|function)')) {
        botText('Debug mode active for ' + target + '. Upload file.');
        startDebuggerFlow({ presetKeywords: target ? [target] : ['error'] });
    } else {
        botText('I understand: <b>Error/Stack</b>, <b>Performance</b>, or <b>Audit</b>. What do you need?');
    }
  }

  /* ============================ UI HELPERS ============================== */
  function addMessage(role, el) { 
    var wrap = document.createElement('div'); wrap.className = 'ltb-msg ltb-msg-' + role;
    var bub = document.createElement('div'); bub.className = 'ltb-bubble'; bub.appendChild(el);
    wrap.appendChild(bub); document.getElementById('ltb-messages').appendChild(wrap); 
    return wrap; 
  }
  function botText(html) { var d = document.createElement('div'); d.className = 'ltb-text'; d.innerHTML = html; addMessage('bot', d); }
  function userText(text) { var d = document.createElement('div'); d.className = 'ltb-text'; d.textContent = text; addMessage('user', d); }
  function createDropzone(accept, label, onFile) {
    var btn = document.createElement('button'); btn.className = 'ltb-upload-btn'; btn.textContent = label;
    var inp = document.createElement('input'); inp.type = 'file'; inp.style.display = 'none';
    btn.onclick = () => inp.click(); inp.onchange = () => onFile(inp.files[0]);
    var d = document.createElement('div'); d.appendChild(btn); d.appendChild(inp); return d;
  }

  /* =============================== BOOTSTRAP =============================== */
  function buildPanel() {
    var root = document.createElement('div'); root.id = 'ltb-root';
    root.innerHTML = '<button id="ltb-launcher">ln&gt;</button><div id="ltb-panel" class="ltb-hidden"><div id="ltb-titlebar"><span class="ltb-title">Trace Assist</span><button id="ltb-close">✕</button></div><div id="ltb-messages"></div><div id="ltb-input-area"><input type="text" id="ltb-input" placeholder="Type here..."></div></div>';
    document.body.appendChild(root);
    root.querySelector('#ltb-launcher').onclick = () => root.querySelector('#ltb-panel').classList.toggle('ltb-hidden');
    root.querySelector('#ltb-input').onkeydown = (e) => { 
        if(e.key === 'Enter') { userText(e.target.value); handleUserMessage(e.target.value); e.target.value = ''; } 
    };
  }
  buildPanel();
})();
</script>
</body>
</html>
