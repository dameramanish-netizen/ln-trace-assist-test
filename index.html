    '.ltb-compare-title-bad{background:rgba(248,113,113,.12);color:#F87171;border:1px solid rgba(248,113,113,.3);}',
    '.ltb-explorer{background:#0F1729;border:1px solid #22314C;border-radius:8px;padding:8px;max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:4px;}',
    '.ltb-tree-btn{width:100%;text-align:left;background:#1E293B;color:#34D399;border:1px solid #334155;border-left:3px solid #34D399;border-radius:6px;padding:6px 8px;font-family:"JetBrains Mono",Consolas,monospace;font-size:11.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}',
    '.ltb-tree-btn:hover{background:#26344d;}',
    '.ltb-return-line{font-family:"JetBrains Mono",Consolas,monospace;font-size:11.5px;color:#38BDF8;background:#0C4A6E;padding:6px 8px;border-radius:6px;border-left:3px solid #38BDF8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}',
    '.ltb-back-btn{align-self:flex-start;background:transparent;border:1px solid #334155;color:#93A4C3;padding:5px 10px;border-radius:6px;font-size:11.5px;cursor:pointer;margin-bottom:4px;}',
    '.ltb-back-btn:hover{color:#F2A93C;border-color:#F2A93C;}',
    '.ltb-anchor-card{background:#1E293B;border-top:3px solid #34D399;border-radius:8px;padding:8px;margin-bottom:6px;font-family:"JetBrains Mono",Consolas,monospace;font-size:11.5px;color:#E2E8F0;word-break:break-word;}',
    '.ltb-child-label{color:#93A4C3;font-size:11px;margin:2px 0 2px;text-transform:uppercase;letter-spacing:.03em;}',
    '.ltb-footer-note{color:#5B6C8F;font-size:10.5px;text-align:center;padding:6px 4px 0;}',
    '@media (max-width:480px){#ltb-panel{position:fixed;inset:0;width:100vw;height:100vh;max-width:100vw;max-height:100vh;border-radius:0;bottom:0;right:0;}#ltb-root{inset:auto 12px 12px auto;}.ltb-compare-grid{grid-template-columns:1fr;}}'
  ].join('\n');

  var styleEl = document.createElement('style');
  styleEl.textContent = CSS;
  document.head.appendChild(styleEl);

  /* ============================== STREAMING CORE ============================== */
  
  async function processStreamedFile(file, onLineRead, onStatusUpdate) {
    let stream = file.stream();
    
    // Natively decompress .gz files using Web Streams
    if (file.name.toLowerCase().endsWith('.gz')) {
      stream = stream.pipeThrough(new DecompressionStream('gzip'));
    }
    
    const textStream = stream.pipeThrough(new TextDecoderStream());
    const reader = textStream.getReader();
    
    let remainder = '';
    let lineCount = 0;

    try {
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const chunkString = remainder + (value || '');
        const lines = chunkString.split(/\r?\n/);
        
        remainder = lines.pop(); // Keep incomplete line for next chunk

        for (let i = 0; i < lines.length; i++) {
          lineCount++;
          const breakStream = onLineRead(lines[i], lineCount);
          if (breakStream) return lineCount; // Allow early exit for specific searches
        }
        
        // Yield to the UI every 250k lines to prevent browser freezing on huge files
        if (lineCount % 250000 === 0) {
            if (onStatusUpdate) onStatusUpdate(lineCount);
            await new Promise(resolve => setTimeout(resolve, 0));
        }
      }

      if (remainder) {
        lineCount++;
        onLineRead(remainder, lineCount);
      }
      
      return lineCount;
    } catch (e) {
      console.error("Streaming error:", e);
      throw e;
    } finally {
      reader.releaseLock();
    }
  }

  function timeToMs(t) {
    var m = /(\d{2}):(\d{2}):(\d{2})\.(\d{3})/.exec(t);
    if (!m) return null;
    return (((+m[1] * 60 + +m[2]) * 60 + +m[3]) * 1000) + (+m[4]);
  }

  var BLACKLIST = ['ottstptcserver'];
  var TARGETS = ['dal.handle.field.error', '__dal.set.message(', 'form.text$('];

  /* =============================== FLOWS ================================== */

  function startDebuggerFlow() {
    botText('Upload your Infor LN trace file (<code>.txt</code>, <code>.log</code>, or <code>.gz</code>). It processes via native streams, so massive files are safe.');
    var selectedFile = null;
    
    var dz = createDropzone('.txt,.log,.gz', '📎 Upload trace file', function (file) {
      selectedFile = file;
      proceedToConfig();
    });
    addMessage('bot', dz);

    function proceedToConfig() {
      botText('File ready: <b>' + selectedFile.name + '</b>. Add keywords and set filters.');
      var wrap = document.createElement('div');
      wrap.className = 'ltb-config';
      var kw = createKeywordInput();
      var dalCheck = createCheckbox('DAL error filter', true);
      var depthCheck = createCheckbox('Depth marker filter', false);
      var tsCheck = createCheckbox('Truncate timestamps in stack view', true);
      
      wrap.appendChild(labelWrap('Keywords', kw.el));
      wrap.appendChild(dalCheck.el);
      wrap.appendChild(depthCheck.el);
      wrap.appendChild(tsCheck.el);
      
      var statusText = document.createElement('div');
      statusText.className = 'ltb-upload-status';
      wrap.appendChild(statusText);

      wrap.appendChild(createButton('▶ Run search', async function () {
        userText('Run search');
        statusText.textContent = 'Scanning lines...';
        
        let matches = [];
        let displayMatches = [];
        let queries = kw.getKeywords();
        let incDal = dalCheck.checked();
        let incDepth = depthCheck.checked();
        let capped = false;
        let pendingFormText = false;

        await processStreamedFile(selectedFile, (line) => {
          if (BLACKLIST.some(b => line.includes(b))) return false;

          let clean = line.trim();

          // Handle multi-line form.text$ capture
          if (pendingFormText) {
             if (clean.includes('3gl call returned:')) {
                 displayMatches[displayMatches.length - 1] = clean;
             }
             pendingFormText = false;
          }

          let hasDal = TARGETS.some(t => line.includes(t));
          let hasDepth = line.includes('-->>') && line.includes('(depth');
          let matchedQ = queries.find(q => line.includes(q));

          let show = false;
          if (queries.length) {
            if (matchedQ) {
              if (incDal && incDepth) show = hasDal || hasDepth;
              else if (incDal) show = true;
              else if (incDepth) show = hasDepth;
              else show = true;
            }
            if (!show && incDal && hasDal) show = true;
          } else {
            if (incDal && incDepth) show = hasDal && hasDepth;
            else if (incDal) show = hasDal;
            else if (incDepth) show = hasDepth;
          }

          if (show) {
            matches.push(clean);
            displayMatches.push(clean);
            if (clean.includes('form.text$')) pendingFormText = true;

            if (matches.length >= 1000) {
              capped = true;
              return true; // Stop stream early if we hit limit
            }
          }
          return false;
        }, (linesRead) => {
            statusText.textContent = `Scanned ${linesRead.toLocaleString()} lines...`;
        });
        
        statusText.textContent = '';
        showResults({ matches, displayMatches, capped }, tsCheck.checked());
      }, 'primary'));
      
      addMessage('bot', wrap);
    }

    function showResults(res, useTs) {
      if (!res.matches.length) {
        botText('No matching lines found.');
        return;
      }
      botText('Found <b>' + res.matches.length.toLocaleString() + '</b> matching line(s)' + (res.capped ? ' (capped at 1,000 for performance)' : '') + '. Click a row to reconstruct its call stack. <i>Note: This triggers a fast second-pass stream scan.</i>');
      
      var rows = res.displayMatches.map(l => [l]);
      var table = createTable(['Filtered trace output'], rows, async function (i) {
        var selected = res.matches[i];
        userText('View stack → line ' + (i + 1));
        
        if (!selected.includes('(depth')) {
            botText('This line has no structured depth marker, so a stack cannot be reconstructed.');
            return;
        }

        var sessionMatch = selected.match(/:::\(\d+\):/);
        var sessionId = sessionMatch ? sessionMatch[0] : null;
        var targetDepth = parseInt(selected.split('(depth')[1].split(')')[0].trim(), 10) || 0;
        
        if (targetDepth <= 0) {
            botText('Top-level call (depth 0) — no parent stack above it.');
            return;
        }

        botText('<i>Streaming file again to rebuild stack...</i>');
        
        let stackMap = {};
        let stackOutput = [];
        
        // Second pass: Stream specifically to build the contextual stack
        await processStreamedFile(selectedFile, (line) => {
            let clean = line.trim();
            if (sessionId && !clean.includes(sessionId)) return false;

            if (clean.includes('-->>') && clean.includes('(depth') && clean.includes('(in object')) {
                if (!BLACKLIST.some(b => clean.includes(b))) {
                    try {
                        let d = parseInt(clean.split('(depth')[1].split(')')[0].trim(), 10);
                        stackMap[d] = clean;
                    } catch (e) { }
                }
            }
            
            // Stop scanning once we reach our target line
            if (clean.includes(selected)) {
                let validDepths = Object.keys(stackMap).map(Number).filter(d => d <= targetDepth).sort((a,b)=>a-b);
                for (let j = 0; j < validDepths.length; j++) {
                    let t = stackMap[validDepths[j]];
                    if (useTs && t.includes('-->>')) t = t.slice(t.indexOf('-->>'));
                    stackOutput.push(t.trim());
                }
                return true; // Stop stream
            }
            return false;
        });

        var pre = document.createElement('pre');
        pre.className = 'ltb-pre';
        pre.textContent = stackOutput.join('\n\n') || "Could not find stack history.";
        addMessage('bot', pre);
      });
      addMessage('bot', table);
    }
  }

  function startPerformanceFlow() {
    botText('Upload your trace file. I will stream it line-by-line to pair `-->>` and `<<--` operations, catching slow calls without loading the whole file into RAM.');
    var selectedFile = null;
    
    var dz = createDropzone('.txt,.log,.gz', '📎 Upload trace file', function (file) {
      selectedFile = file;
      proceedToThreshold();
    });
    addMessage('bot', dz);

    function proceedToThreshold() {
      botText('File ready: <b>' + selectedFile.name + '</b>. Set the slow-call threshold, then run the scan.');
      var wrap = document.createElement('div');
      wrap.className = 'ltb-config';
      var threshold = 10;
      wrap.appendChild(createSlider(0, 500, 10, function (v) { threshold = v; }));
      
      var statusText = document.createElement('div');
      statusText.className = 'ltb-upload-status';
      wrap.appendChild(statusText);

      wrap.appendChild(createButton('▶ Analyze', async function () {
        userText('Analyze (threshold ' + threshold + 'ms)');
        statusText.textContent = 'Streaming and analyzing...';

        let stack = [];
        let slow = [];
        let entryRe = /\[(\d{2}:\d{2}:\d{2}\.\d{3})\].*?-->>\s+\(depth\s+\d+\):\s+(.*?)\((.*?)\)\s+\(in object\s+(.*?)\)/;
        let exitRe = /\[(\d{2}:\d{2}:\d{2}\.\d{3})\].*?<<--\s+\(depth\s+\d+\):\s+(.*)/;
        let tableRe = /"([^"]+)"/;

        let totalLines = await processStreamedFile(selectedFile, (line, count) => {
            let em = entryRe.exec(line);
            if (em) {
                var tableName = 'N/A';
                var tm = tableRe.exec(em[3]);
                if (tm && tm[1].trim()) tableName = tm[1].trim();
                else if (em[3].includes('whinh') || em[3].includes('ttadv')) {
                    var wm = em[3].match(/[a-z]{5}\d{3}/g);
                    if (wm && wm.length) tableName = wm[0];
                }
                var startMs = timeToMs(em[1]);
                if (startMs !== null) stack.push({ name: em[2].trim(), table: tableName, start: startMs, object: em[4].trim() });
                return false;
            }

            var xm = exitRe.exec(line);
            if (xm && stack.length) {
                var endMs = timeToMs(xm[1]);
                var popInfo = stack.pop();
                if (endMs !== null) {
                    var duration = endMs - popInfo.start;
                    if (duration < 0) duration += 86400000;
                    if (duration > threshold) {
                        slow.push({
                            line: count,
                            functionName: popInfo.name,
                            tableName: popInfo.table,
                            durationMs: Math.round(duration * 100) / 100,
                            executingObject: popInfo.object
                        });
                    }
                }
            }
            return false;
        }, (linesRead) => {
            statusText.textContent = `Scanned ${linesRead.toLocaleString()} lines...`;
        });

        statusText.textContent = '';
        showPerfResults({ slow, lineCount: totalLines }, threshold);
      }, 'primary'));
      
      addMessage('bot', wrap);
    }

    function showPerfResults(res, threshold) {
      botText('Scanned <b>' + res.lineCount.toLocaleString() + '</b> lines. Found <b>' + res.slow.length.toLocaleString() + '</b> call(s) slower than ' + threshold + 'ms.');
      if (!res.slow.length) return;

      var sorted = res.slow.slice().sort((a, b) => b.durationMs - a.durationMs);
      var shown = Math.min(500, sorted.length);
      var rows = sorted.slice(0, shown).map(s => [s.functionName, s.tableName, s.durationMs.toFixed(2), s.executingObject]);
      
      addMessage('bot', createTable(['Function', 'Table', 'Duration (ms)', 'Object'], rows));
      
      var agg = {};
      res.slow.forEach(s => {
        var key = s.functionName + '|||' + s.tableName;
        if (!agg[key]) agg[key] = { functionName: s.functionName, tableName: s.tableName, executions: 0, total: 0 };
        agg[key].executions++;
        agg[key].total += s.durationMs;
      });
      var aggRows = Object.values(agg).sort((a, b) => b.total - a.total).slice(0, 500).map(a => [a.functionName, a.tableName, a.executions, a.total.toFixed(2)]);
      
      botText('Aggregated bottleneck matrix:');
      addMessage('bot', createTable(['Function', 'Table', 'Executions', 'Total duration (ms)'], aggRows));
    }
  }

  function startCompareFlow() {
    botText('The Compare Tool builds a visual tree. Note: Loading 40 crore node elements into the DOM is impossible, so this tool will parse and capture up to 50,000 contextual nodes per file for safety.');
    // Due to DOM limitations, we still limit the array size for the tree explorer, 
    // but the file itself is streamed safely.
    var grid = document.createElement('div');
    grid.className = 'ltb-compare-grid';
    var colA = document.createElement('div'); colA.className = 'ltb-compare-col';
    var colB = document.createElement('div'); colB.className = 'ltb-compare-col';
    colA.innerHTML = '<div class="ltb-compare-title ltb-compare-title-ok">✅ Working trace</div>';
    colB.innerHTML = '<div class="ltb-compare-title ltb-compare-title-bad">❌ Broken trace</div>';
    
    var dataA = null, dataB = null;
    
    async function streamLinearScan(file, targetArr) {
        let depthRe = /\(depth\s+(\d+)\):/;
        await processStreamedFile(file, (line, idx) => {
            if (!line.trim()) return false;
            let displayText = line.includes('Flow:') ? line.split('Flow:').pop() : ' ' + line.trim();
            let dm = depthRe.exec(line);
            targetArr.push({
                idx: idx,
                text: displayText.trim(),
                raw: line,
                depth: dm ? parseInt(dm[1], 10) : 0,
                isCall: line.includes('-->'),
                isReturn: line.includes('<--')
            });
            if (targetArr.length >= 50000) return true; // Capped for DOM tree safety
            return false;
        });
    }

    colA.appendChild(createDropzone('.txt,.log,.gz', '📎 Upload working', async function (f) { dataA = []; await streamLinearScan(f, dataA); }));
    colB.appendChild(createDropzone('.txt,.log,.gz', '📎 Upload broken', async function (f) { dataB = []; await streamLinearScan(f, dataB); }));
    
    grid.appendChild(colA); grid.appendChild(colB);
    addMessage('bot', grid);

    var kwWrap = document.createElement('div');
    kwWrap.className = 'ltb-config';
    var kw = createKeywordInput();
    kwWrap.appendChild(labelWrap('Filter keywords', kw.el));
    kwWrap.appendChild(createButton('🔍 Build explorers', function () {
      userText('Build explorers');
      
      var explorerGrid = document.createElement('div');
      explorerGrid.className = 'ltb-compare-grid';
      var explA = document.createElement('div'); explA.className = 'ltb-explorer';
      var explB = document.createElement('div'); explB.className = 'ltb-explorer';
      explorerGrid.appendChild(explA); explorerGrid.appendChild(explB);

      var keywords = kw.getKeywords();
      var focusA = [], focusB = [];
      
      // Re-using your original renderExplorer logic here
      function renderA() { renderExplorer(explA, dataA || [], keywords, focusA, renderA); }
      function renderB() { renderExplorer(explB, dataB || [], keywords, focusB, renderB); }
      if (dataA) renderA(); else explA.innerHTML = '<div class="ltb-empty">No trace.</div>';
      if (dataB) renderB(); else explB.innerHTML = '<div class="ltb-empty">No trace.</div>';

      addMessage('bot', explorerGrid);
    }, 'primary'));
    addMessage('bot', kwWrap);
  }

  // (The rest of the UI Primitives, Dropzone modifications, and Bootstrap remain identical to the original)
  function renderExplorer(container, lines, keywords, focusStack, onStackChange) { /* ... original code ... */ }
  function showMainMenu() { /* ... original code ... */ }
  function showHelp() { /* ... original code ... */ }
  function buildPanel() { /* ... original code ... */ }

  /* ============================ UI PRIMITIVES ============================= */
  var messagesEl;
  function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }
  function addMessage(role, contentEl) { var wrap = document.createElement('div'); wrap.className = 'ltb-msg ltb-msg-' + role; var bubble = document.createElement('div'); bubble.className = 'ltb-bubble'; bubble.appendChild(contentEl); wrap.appendChild(bubble); messagesEl.appendChild(wrap); scrollToBottom(); return bubble; }
  function botText(html) { var d = document.createElement('div'); d.className = 'ltb-text'; d.innerHTML = html; return addMessage('bot', d); }
  function userText(text) { var d = document.createElement('div'); d.className = 'ltb-text'; d.textContent = text; return addMessage('user', d); }
  function quickReplies(options) { var wrap = document.createElement('div'); wrap.className = 'ltb-quick-replies'; options.forEach(function (o) { var b = document.createElement('button'); b.className = 'ltb-chip'; b.textContent = o.label; b.onclick = function () { Array.from(wrap.children).forEach(bb => bb.disabled = true); userText(o.label); o.onClick(); }; wrap.appendChild(b); }); return addMessage('bot', wrap); }
  
  function createDropzone(accept, label, onFile) {
    var wrap = document.createElement('div'); wrap.className = 'ltb-dropzone';
    var input = document.createElement('input'); input.type = 'file'; input.accept = accept; input.style.display = 'none';
    var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'ltb-upload-btn'; btn.textContent = label; btn.onclick = function () { input.click(); };
    var status = document.createElement('span'); status.className = 'ltb-upload-status';
    input.onchange = function () {
      if (!input.files.length) return;
      status.textContent = '✓ ' + input.files[0].name;
      onFile(input.files[0]);
    };
    wrap.appendChild(btn); wrap.appendChild(input); wrap.appendChild(status);
    return wrap;
  }

  function createCheckbox(label, checked) { var wrap = document.createElement('label'); wrap.className = 'ltb-checkbox'; var input = document.createElement('input'); input.type = 'checkbox'; input.checked = checked; var span = document.createElement('span'); span.textContent = label; wrap.appendChild(input); wrap.appendChild(span); return { el: wrap, checked: function () { return input.checked; } }; }
  function labelWrap(labelText, el) { var wrap = document.createElement('div'); var lab = document.createElement('div'); lab.className = 'ltb-field-label'; lab.textContent = labelText; wrap.appendChild(lab); wrap.appendChild(el); return wrap; }
  function createKeywordInput() { var wrap = document.createElement('div'); var list = document.createElement('div'); list.className = 'ltb-kw-list'; var input = document.createElement('input'); input.type = 'text'; input.placeholder = 'Type a keyword and press Enter'; input.className = 'ltb-kw-input'; var keywords = []; function renderChips() { list.innerHTML = ''; keywords.forEach(function (k, i) { var chip = document.createElement('span'); chip.className = 'ltb-kw-chip'; chip.textContent = k + ' ✕'; chip.onclick = function () { keywords.splice(i, 1); renderChips(); }; list.appendChild(chip); }); } input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); var v = input.value.trim(); if (v && keywords.indexOf(v) === -1) { keywords.push(v); renderChips(); } input.value = ''; } }); wrap.appendChild(list); wrap.appendChild(input); return { el: wrap, getKeywords: function () { return keywords.slice(); } }; }
  function createSlider(min, max, val, onChange) { var wrap = document.createElement('div'); wrap.className = 'ltb-slider-wrap'; var label = document.createElement('div'); label.className = 'ltb-slider-label'; label.textContent = 'Threshold: ' + val + ' ms'; var input = document.createElement('input'); input.type = 'range'; input.min = min; input.max = max; input.value = val; input.oninput = function () { label.textContent = 'Threshold: ' + input.value + ' ms'; onChange(parseInt(input.value, 10)); }; wrap.appendChild(label); wrap.appendChild(input); return wrap; }
  function createButton(text, onClick, variant) { var b = document.createElement('button'); b.type = 'button'; b.className = 'ltb-btn' + (variant ? ' ltb-btn-' + variant : ''); b.textContent = text; b.onclick = onClick; return b; }
  
  function createTable(headers, rows, onRowClick) {
    var wrap = document.createElement('div'); wrap.className = 'ltb-table-wrap';
    var table = document.createElement('table'); table.className = 'ltb-table';
    var thead = document.createElement('thead'); var trh = document.createElement('tr');
    headers.forEach(function (h) { var th = document.createElement('th'); th.textContent = h; trh.appendChild(th); });
    thead.appendChild(trh); table.appendChild(thead);
    var tbody = document.createElement('tbody');
    
    // Optimized fragment appending
    var fragment = document.createDocumentFragment();
    rows.forEach(function (r, i) {
      var tr = document.createElement('tr');
      if (onRowClick) { tr.className = 'ltb-row-clickable'; tr.onclick = function () { onRowClick(i, r); }; }
      r.forEach(function (cell) { var td = document.createElement('td'); td.textContent = cell; tr.appendChild(td); });
      fragment.appendChild(tr);
    });
    tbody.appendChild(fragment);
    table.appendChild(tbody); wrap.appendChild(table);
    return wrap;
  }

  function renderExplorer(container, lines, keywords, focusStack, onStackChange) {
    container.innerHTML = '';
    if (!focusStack.length) {
      var any = false;
      var fragment = document.createDocumentFragment();
      lines.forEach(function (row) {
        if (row.isCall) {
          var matchesKw = !keywords.length || keywords.some(function (kw) { return row.raw.toLowerCase().indexOf(kw.toLowerCase()) !== -1; });
          if (matchesKw) {
            any = true;
            var btn = document.createElement('button'); btn.className = 'ltb-tree-btn'; btn.textContent = row.text || '(blank call line)'; btn.title = row.text; btn.onclick = function () { focusStack.push(row); onStackChange(); };
            fragment.appendChild(btn);
          }
        }
      });
      container.appendChild(fragment);
      if (!any) { var empty = document.createElement('div'); empty.className = 'ltb-empty'; empty.textContent = lines.length ? 'No matching call lines found for this filter.' : 'No trace loaded yet.'; container.appendChild(empty); }
      return;
    }

    var backBtn = document.createElement('button'); backBtn.className = 'ltb-back-btn'; backBtn.textContent = '← Back'; backBtn.onclick = function () { focusStack.pop(); onStackChange(); }; container.appendChild(backBtn);
    var anchor = focusStack[focusStack.length - 1]; var startIdx = anchor.idx; var anchorDepth = anchor.depth; var endIdx = lines.length;
    for (var i = startIdx + 1; i < lines.length; i++) { if (lines[i].isReturn && lines[i].depth === anchorDepth) { endIdx = i; break; } }
    var windowLines = lines.slice(startIdx, Math.min(endIdx + 1, lines.length));

    var card = document.createElement('div'); card.className = 'ltb-anchor-card'; card.textContent = '-->> (depth ' + anchorDepth + ')  ' + anchor.text; container.appendChild(card);
    var childLabel = document.createElement('div'); childLabel.className = 'ltb-child-label'; childLabel.textContent = 'Inner execution layers'; container.appendChild(childLabel);
    
    var fragment = document.createDocumentFragment();
    var foundChildren = false;
    windowLines.forEach(function (row) {
      if (row.depth === anchorDepth + 1) {
        foundChildren = true;
        if (row.isCall) {
          var btn = document.createElement('button'); btn.className = 'ltb-tree-btn'; btn.textContent = row.text; btn.title = row.text; btn.onclick = function () { focusStack.push(row); onStackChange(); }; fragment.appendChild(btn);
        } else if (row.isReturn) {
          var ret = document.createElement('div'); ret.className = 'ltb-return-line'; ret.textContent = row.text; ret.title = row.text; fragment.appendChild(ret);
        }
      }
    });
    container.appendChild(fragment);
    
    if (!foundChildren) { var noChild = document.createElement('div'); noChild.className = 'ltb-empty'; noChild.textContent = 'No nested calls inside this layer.'; container.appendChild(noChild); }
    if (endIdx < lines.length) { var closing = document.createElement('div'); closing.className = 'ltb-return-line'; closing.style.borderTop = '1px dashed #38BDF8'; closing.style.marginTop = '6px'; closing.textContent = lines[endIdx].text; closing.title = lines[endIdx].text; container.appendChild(closing); }
  }

  function showMainMenu() { botText('Hi! I\'m <b>' + CONFIG.title + '</b>. What would you like to do?'); quickReplies([ { label: '🐞 Debug a trace', onClick: startDebuggerFlow }, { label: '🔀 Compare two traces', onClick: startCompareFlow }, { label: '⚡ Check performance', onClick: startPerformanceFlow }, { label: '❓ How this works', onClick: showHelp } ]); }
  function showHelp() { botText('All processing utilizes native Web Streams. This allows infinite file sizes to be parsed locally without crashing memory limits.'); quickReplies([{ label: '⬅ Back to menu', onClick: showMainMenu }]); }

  function buildPanel() {
    var root = document.createElement('div'); root.id = 'ltb-root';
    root.innerHTML = '<button id="ltb-launcher" aria-label="Open ' + CONFIG.title + '"><span class="ltb-launcher-prompt">ln&gt;</span><span class="ltb-cursor"></span></button><div id="ltb-panel" class="ltb-hidden"><div id="ltb-titlebar"><span class="ltb-dot ltb-dot-red"></span><span class="ltb-dot ltb-dot-amber"></span><span class="ltb-dot ltb-dot-green"></span><span class="ltb-title">' + CONFIG.title + '</span><button id="ltb-restart" title="Start over">↺</button><button id="ltb-close" title="Close">✕</button></div><div id="ltb-messages"></div></div>';
    document.body.appendChild(root);
    var launcher = root.querySelector('#ltb-launcher'); var panel = root.querySelector('#ltb-panel'); messagesEl = root.querySelector('#ltb-messages');
    launcher.onclick = function () { panel.classList.toggle('ltb-hidden'); }; root.querySelector('#ltb-close').onclick = function () { panel.classList.add('ltb-hidden'); }; root.querySelector('#ltb-restart').onclick = function () { messagesEl.innerHTML = ''; showMainMenu(); };
    showMainMenu();
  }

  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', buildPanel); } else { buildPanel(); }
})();
</script>
